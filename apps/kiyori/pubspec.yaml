name: kiyori
description: "Kiyori personal cross-platform AI workspace."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kiyori_bridge: ^0.1.0
  kiyori_ui: ^0.1.0
  markdown: 7.3.1
  path_provider: 2.1.6
  unorm_dart: 0.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/navigation/
    - assets/chrome/
    - assets/emoji/happy/
    - assets/emoji/sad/
    - assets/emoji/angry/
    - assets/emoji/surprised/
    - assets/emoji/confused/
    - assets/emoji/crying/
    - assets/emoji/like_you/
    - assets/emoji/miss_you/
    - assets/emoji/speechless/
