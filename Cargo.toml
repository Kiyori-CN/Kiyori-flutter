[workspace]
members = ["crates/kiyori_core", "crates/kiyori_ffi", "packages/kiyori_platform/native", "packages/kiyori_platform/scripts"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
jieba-rs = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "=1.0.9"
base64 = "=0.23.1"
ring = "=0.17.14"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
